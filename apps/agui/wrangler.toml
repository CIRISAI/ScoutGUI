# Cloudflare Pages/Workers Configuration for ScoutGUI

name = "scoutgui"
# 2024-09-23 is the threshold at which `nodejs_compat` provides the FULL Node.js
# API surface (the v2 semantics). Before it, the flag gives a limited polyfill
# set that omits `node:async_hooks` / AsyncLocalStorage — which React's SSR path
# inside @cloudflare/next-on-pages depends on.
#
# The symptom was precise: every STATIC page served fine (no Function invoked),
# and every DYNAMIC route returned the Workers runtime's unhandled-exception
# response — HTTP 500, content-type text/plain, body "Internal Server Error",
# with no Next.js headers at all, because the Function died before Next ran:
#
#     /oauth/callback                        static   200  (x-nextjs-prerender: 1)
#     /oauth/[agent]/callback                dynamic  500
#     /oauth/[agent]/[provider]/callback     dynamic  500
#
# This date was "2024-01-01" — nine months before the threshold.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Pages configuration
pages_build_output_dir = ".vercel/output/static"

# OAuth Routing (Consistent Across All Servers)
#
# OAuth Callbacks (special direct route):
#   Pattern: /v1/auth/oauth/{agent_id}/{provider}/callback
#   Example: https://scoutapilb.ciris.ai/v1/auth/oauth/scout-remote-test-dahrb9/google/callback
#
# OAuth Login & All Other API Calls (via standard API route):
#   Pattern: /api/{agent_id}/v1/...
#   Example: https://scoutapilb.ciris.ai/api/scout-remote-test-dahrb9/v1/auth/oauth/google/login

# Environment variables
[vars]
NEXT_PUBLIC_API_BASE_URL = "https://scoutapilb.ciris.ai/api/scout-remote-test-dahrb9"
NEXT_PUBLIC_SCOUT_API_URL = "https://scoutapilb.ciris.ai/api/scout-remote-test-dahrb9"

# Environment variables (for production)
[env.production.vars]
NEXT_PUBLIC_API_BASE_URL = "https://scoutapilb.ciris.ai/api/scout-remote-test-dahrb9"
NEXT_PUBLIC_SCOUT_API_URL = "https://scoutapilb.ciris.ai/api/scout-remote-test-dahrb9"

# You can set secrets using: wrangler secret put <KEY>
# For example: wrangler secret put NEXT_PUBLIC_SCOUT_API_URL

# KV Namespaces (if needed for caching)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# Routes configuration (optional)
# routes = [
#   { pattern = "scout.ciris.ai", zone_name = "ciris.ai" }
# ]
